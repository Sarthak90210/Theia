appId: com.sarthak90210.theia
productName: Theia
asar: false
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist-app/**
  - '!dist-app/**/*.map'
  - package.json
  - THIRD-PARTY-NOTICES.md
  # Search model runtime: Windows x64 only. Transformers.js carries its own
  # copy of the web runtime inside its Node build, so onnxruntime-web is unused.
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  - '!node_modules/@huggingface/transformers/dist/transformers.{js,min.js,web.js,web.min.js}'
  - '!node_modules/@huggingface/transformers/dist/*.map'
extraResources:
  - from: .release-tools/ffmpeg
    to: bin
  # EmbeddingGemma 2 for search, pinned and verified by scripts/prepare-models.mjs.
  # Shipped so search works offline from the first launch, with nothing to set up.
  - from: .release-tools/models
    to: models
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
win:
  icon: build/theia.ico
  executableName: Theia
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Theia-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: Theia-Portable-${version}-${arch}.${ext}
publish: null
